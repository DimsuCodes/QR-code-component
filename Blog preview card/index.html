<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="styles.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
    <div class="white-box">
    <section id="blog-card">
        <div class="blog-card">
            <img src="images/illustration-article.svg" alt="Image of illustration">
        </div>
    </section>



    <section id="blog-info">
        <div class="blog-info">
            <h1 class="t1">Learning</h1>
                <p class="p1">Published 21 Dec 2023</p>
            
            <h2 class="t2"><a href="#">HTML & CSS foundations</a></h2>
                <p class="p2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
            
               
        </div>
    </section>

    <section>
        <div class="avatar">
            <img class="avatar-img" src="images/image-avatar.webp" alt="image of profile picture/avatar"> 
                     <p class="avatar-name">Greg Hooper</p>
        </div>
    </section>
  </div>
  <footer class="attribution">
    Challenge by <a class="a-f" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a class="a-f" href="https://github.com/DimsuCodes">DimsuCodes</a>.
  </footer>
</body>
</html>
