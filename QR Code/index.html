<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section>
            <div class="qr-bg">
                <div class="qr-box">
                    <img src="./images/image-qr-code.png" alt="QR code image">
                    <h1 class="qr-title">Improve your front-end skills by building projects</h1>
                    <p class="qr-quote">Scan the QR code to visit Frontend Mentor and take your coding skills to the next Level!</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
        Coded by <a href="#">Dimsu Codes</a>.
    </footer>
</body>
</html>
